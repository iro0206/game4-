<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>落下物よけゲーム（スッキリ版）</title>
<style>
body { margin:0; background:#222; color:white; font-family:sans-serif; text-align:center; }
h1{margin:10px;}
#info{ font-size:18px; margin-bottom:10px; }
#game{ width:400px; height:600px; background:#111; margin:auto; position:relative; overflow:hidden; border:4px solid white; border-radius:12px; }
#player{ width:40px; height:40px; background:none; position:absolute; bottom:10px; left:180px; display:flex; justify-content:center; align-items:center; font-size:30px; transition:left 0.05s; }
.obstacle{ width:50px; height:50px; background:none; color:red; display:flex; justify-content:center; align-items:center; font-size:40px; position:absolute; border-radius:50%; }
.coin{ width:30px; height:30px; background:none; color:gold; display:flex; justify-content:center; align-items:center; font-size:25px; position:absolute; transition: transform 0.2s; }
#score{ font-size:22px; margin:10px; }
#gameoverScreen{ display:none; font-size:28px; color:red; margin-top:10px; }
button{ padding:8px 16px; font-size:16px; margin-top:10px; }
</style>
</head>
<body>

<h1>落下物よけゲーム</h1>
<div id="info">
💣 赤い爆弾 = 避ける<br>
🪙 黄色いコイン = 取るとポイント（ぷよん！）
</div>

<div id="score">スコア: 0</div>
<div id="game">
  <div id="player">😀</div>
</div>
<div id="gameoverScreen">ゲームオーバー</div>
<button onclick="restart()">リスタート</button>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const gameoverScreen = document.getElementById("gameoverScreen");

let playerX = 180;
let score = 0;
let objects = [];
let running = true;
let spawnSpeed = 0.03;
let fallSpeed = 4;

function spawn() {
  let obj = document.createElement("div");
  if(Math.random() < 0.7){
    obj.className = "obstacle";
    obj.type = "obstacle";
    obj.w = 50; obj.h = 50;
    obj.textContent = "💣";
    obj.angle = 0;
    obj.direction = Math.random()<0.5?1:-1;
  } else {
    obj.className = "coin";
    obj.type = "coin";
    obj.w = 30; obj.h = 30;
    obj.textContent = "🪙";
    obj.bounce = 0;
  }
  obj.x = Math.random()*(400-obj.w);
  obj.y = -50;
  obj.style.left = obj.x+"px";
  obj.style.top = obj.y+"px";
  game.appendChild(obj);
  objects.push(obj);
}

function update() {
  if(!running) return;

  fallSpeed += 0.0005;

  if(Math.random() < spawnSpeed) spawn();

  objects.forEach((o,i)=>{
    o.y += fallSpeed;

    if(o.type === "obstacle") {
      o.angle += 0.05 * o.direction;
      if(Math.abs(o.angle) > 0.3) o.direction *= -1;
      o.style.transform = `rotate(${o.angle}rad)`;
    }

    if(o.type === "coin"){
      o.bounce += 0.2;
      let bounceY = Math.sin(o.bounce)*5;
      o.style.transform = `translateY(${bounceY}px)`;
    }

    o.style.top = o.y+"px";

    const px = playerX;
    const py = 550;

    if(o.x < px+40 && o.x+o.w > px && o.y < py+40 && o.y+o.h > py){
      if(o.type==="obstacle"){
        running = false;
        gameoverScreen.style.display="block";
      }
      if(o.type==="coin"){
        score += 10;
        scoreText.textContent = "スコア: "+score;
        o.style.transform = "scale(1.5)";
        setTimeout(()=>o.remove(),150);
        objects.splice(i,1);
      }
    }

    if(o.y > 620){
      o.remove();
      objects.splice(i,1);
    }
  });

  requestAnimationFrame(update);
}

document.addEventListener("keydown", e=>{
  if(!running) return;
  if(e.key==="ArrowLeft") playerX -= 30;
  if(e.key==="ArrowRight") playerX += 30;
  playerX = Math.max(0, Math.min(360,playerX));
  player.style.left = playerX+"px";
});

function restart(){
  objects.forEach(o=>o.remove());
  objects=[];
  score=0;
  scoreText.textContent="スコア: 0";
  playerX=180;
  player.style.left = playerX+"px";
  running = true;
  spawnSpeed = 0.03;
  fallSpeed = 4;
  gameoverScreen.style.display="none";
  update();
}

update();
</script>
</body>
</html>
