<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>落ちてくる物をよけるゲーム</title>

<style>
body{
margin:0;
background:#222;
color:white;
font-family:sans-serif;
text-align:center;
}

h1{
margin:10px;
}

#info{
font-size:18px;
margin-bottom:10px;
}

#game{
width:400px;
height:600px;
background:#111;
margin:auto;
position:relative;
overflow:hidden;
border:4px solid white;
}

#player{
width:40px;
height:40px;
background:lime;
position:absolute;
bottom:10px;
left:180px;
border-radius:8px;
}

.obstacle{
width:50px;
height:50px;
background:red;
position:absolute;
border:3px solid white;
}

.coin{
width:30px;
height:30px;
background:yellow;
border-radius:50%;
position:absolute;
border:2px solid gold;
}

#score{
font-size:22px;
margin:10px;
}

#gameover{
display:none;
font-size:28px;
color:red;
}
</style>

</head>
<body>

<h1>落下物よけゲーム</h1>

<div id="info">
🔴 赤いブロック = 当たるとゲームオーバー（避ける）<br>
🟡 黄色いコイン = 取るとポイント
</div>

<div id="score">スコア: 0</div>

<div id="game">
<div id="player"></div>
</div>

<div id="gameover">ゲームオーバー</div>

<script>

const game = document.getElementById("game")
const player = document.getElementById("player")
const scoreText = document.getElementById("score")
const gameoverText = document.getElementById("gameover")

let playerX = 180
let score = 0
let objects = []
let running = true

function spawn(){

let obj = document.createElement("div")

if(Math.random()<0.7){
obj.className="obstacle"
obj.type="obstacle"
obj.w=50
obj.h=50
}else{
obj.className="coin"
obj.type="coin"
obj.w=30
obj.h=30
}

obj.x=Math.random()*(400-obj.w)
obj.y=-50

obj.style.left=obj.x+"px"
obj.style.top=obj.y+"px"

game.appendChild(obj)
objects.push(obj)

}

function update(){

if(!running) return

if(Math.random()<0.03){
spawn()
}

objects.forEach((o,i)=>{

o.y+=4
o.style.top=o.y+"px"

let px=playerX
let py=550

if(
o.x < px+40 &&
o.x+o.w > px &&
o.y < py+40 &&
o.y+o.h > py
){

if(o.type==="obstacle"){
gameover()
}

if(o.type==="coin"){
score+=10
scoreText.textContent="スコア: "+score
o.remove()
objects.splice(i,1)
}

}

if(o.y>620){
o.remove()
objects.splice(i,1)
}

})

requestAnimationFrame(update)

}

function gameover(){
running=false
gameoverText.style.display="block"
}

document.addEventListener("keydown",e=>{

if(!running) return

if(e.key==="ArrowLeft"){
playerX-=30
}

if(e.key==="ArrowRight"){
playerX+=30
}

playerX=Math.max(0,Math.min(360,playerX))
player.style.left=playerX+"px"

})

update()

</script>

</body>
</html>
