<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>落下物よけゲーム</title>
<style>
body{
  margin:0;
  background:#222;
  color:white;
  font-family:sans-serif;
  text-align:center;
}

#game{
  position:relative;
  width:400px;
  height:600px;
  margin:20px auto;
  background:#111;
  border:3px solid white;
  overflow:hidden;
}

#player{
  position:absolute;
  bottom:10px;
  left:180px;
  width:40px;
  height:40px;
  font-size:30px;
}

.obstacle, .coin{
  position:absolute;
  width:40px;
  height:40px;
  font-size:30px;
}

.obstacle{
  color:red;
}

.coin{
  color:gold;
}

#score{
  font-size:20px;
  margin-top:10px;
}

#gameover{
  display:none;
  font-size:28px;
  margin-top:10px;
  color:red;
}

button{
  padding:10px 20px;
  font-size:16px;
}
</style>
</head>
<body>

<h1>落下物よけゲーム</h1>
<div id="score">スコア: 0</div>

<div id="game">
  <div id="player">😀</div>
</div>

<div id="gameover">ゲームオーバー</div>
<button onclick="restart()">リスタート</button>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreDisplay = document.getElementById("score");
const gameoverText = document.getElementById("gameover");

let playerX = 180;
let score = 0;
let objects = [];
let gameRunning = true;

function createObject(){
  const obj = document.createElement("div");

  if(Math.random() < 0.7){
    obj.className = "obstacle";
    obj.textContent = "❌";
    obj.type = "obstacle";
  }else{
    obj.className = "coin";
    obj.textContent = "🪙";
    obj.type = "coin";
  }

  obj.x = Math.random() * 360;
  obj.y = -40;

  obj.style.left = obj.x + "px";
  obj.style.top = obj.y + "px";

  game.appendChild(obj);
  objects.push(obj);
}

function update(){
  if(!gameRunning) return;

  if(Math.random() < 0.03){
    createObject();
  }

  objects.forEach((obj,index)=>{
    obj.y += 4;
    obj.style.top = obj.y + "px";

    const px = playerX;
    const py = 550;

    if(
      obj.x < px + 40 &&
      obj.x + 40 > px &&
      obj.y < py + 40 &&
      obj.y + 40 > py
    ){
      if(obj.type === "obstacle"){
        gameOver();
      }else{
        score += 10;
        scoreDisplay.textContent = "スコア: " + score;
        obj.remove();
        objects.splice(index,1);
      }
    }

    if(obj.y > 600){
      obj.remove();
      objects.splice(index,1);
    }
  });

  requestAnimationFrame(update);
}

function gameOver(){
  gameRunning = false;
  gameoverText.style.display = "block";
}

function restart(){
  objects.forEach(o=>o.remove());
  objects=[];
  score=0;
  scoreDisplay.textContent="スコア: 0";
  playerX=180;
  player.style.left=playerX+"px";
  gameRunning=true;
  gameoverText.style.display="none";
  update();
}

document.addEventListener("keydown",e=>{
  if(!gameRunning) return;

  if(e.key==="ArrowLeft"){
    playerX -= 20;
  }
  if(e.key==="ArrowRight"){
    playerX += 20;
  }

  playerX = Math.max(0, Math.min(360, playerX));
  player.style.left = playerX + "px";
});

game.addEventListener("click",e=>{
  if(!gameRunning) return;

  const rect = game.getBoundingClientRect();
  const clickX = e.clientX - rect.left;

  if(clickX < playerX){
    playerX -= 40;
  }else{
    playerX += 40;
  }

  playerX = Math.max(0, Math.min(360, playerX));
  player.style.left = playerX + "px";
});

update();
</script>

</body>
</html>
